# Бүх системийг нэг командаар: docker compose up --build   (ФБШ-11)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uyaldaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uyaldaa}
      POSTGRES_DB: ${POSTGRES_DB:-uyaldaa}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uyaldaa}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uyaldaa}:${POSTGRES_PASSWORD:-uyaldaa}@db:5432/${POSTGRES_DB:-uyaldaa}
      SEED_DIR: /data/seed
    volumes: ["./backend:/app", "./data:/data"]
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    volumes: ["./frontend/src:/app/src"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
